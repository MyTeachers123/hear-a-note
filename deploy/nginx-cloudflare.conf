# Mode B: Cloudflare (orange-cloud proxy + Origin Certificate, SSL mode Full (strict))
# User ──HTTPS (Cloudflare cert)──> Cloudflare ──HTTPS (Origin cert)──> EC2 Nginx

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/hear-a-note-app.conf;
}
