# 模式 B：Cloudflare（橘色雲朵 Proxy + Origin Certificate，SSL 模式 Full (strict)）
# 使用者 ──HTTPS(Cloudflare 憑證)──> Cloudflare ──HTTPS(Origin 憑證)──> EC2 Nginx

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/toddler-music-box-app.conf;
}
