# 安全標頭（Nginx 的 add_header 不會繼承到有自己 add_header 的 location，所以每個 location 都要 include）
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# CSP：只允許載入自己網站的檔案，擋掉任何外部腳本、追蹤器、iframe
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
