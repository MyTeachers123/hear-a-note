# Security headers (Nginx add_header is not inherited by locations that set their own add_header, so every such location includes this)
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(self), midi=(), geolocation=(), payment=()" always;
# CSP: only load files from this site; blocks any external scripts, trackers and iframes
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
