# 共用設定：網站根目錄、API 轉發、快取規則（兩種 HTTPS 模式都會引用）
root __APP_DIR__/static;
index index.html;

server_tokens off;          # 不顯示 Nginx 版本
client_max_body_size 1k;    # 這個 App 不接受上傳
include /etc/nginx/snippets/toddler-music-box-security.conf;

gzip on;
gzip_types text/css application/javascript application/json application/manifest+json;

# Python 後端
location /api/ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Service Worker 不能被快取，否則使用者拿不到新版
location = /sw.js {
    include /etc/nginx/snippets/toddler-music-box-security.conf;
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/" always;
}

location = /manifest.webmanifest {
    include /etc/nginx/snippets/toddler-music-box-security.conf;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
}

# 上架 Google Play（TWA）時需要的 assetlinks.json
location /.well-known/ {
    default_type application/json;
}

# 音檔、圖示：長期快取（Nginx 預設不認得 .wav，補上類型）
location ~* \.wav$ {
    include /etc/nginx/snippets/toddler-music-box-security.conf;
    default_type audio/wav;
    add_header Cache-Control "public, max-age=2592000" always;
}
location ~* \.(mp3|png|svg)$ {
    include /etc/nginx/snippets/toddler-music-box-security.conf;
    add_header Cache-Control "public, max-age=2592000" always;
}

location / {
    limit_except GET HEAD { deny all; }
    try_files $uri $uri/ /index.html;
}
