# Shared settings: web root, API proxy, caching rules (included by both HTTPS modes)
root __APP_DIR__/static;
index index.html;

server_tokens off;          # hide the Nginx version
client_max_body_size 1k;    # this app accepts no uploads
include /etc/nginx/snippets/hear-a-note-security.conf;

gzip on;
gzip_types text/css application/javascript application/json application/manifest+json;

# Python backend
location /api/ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# The Service Worker must not be cached, otherwise users never get the new version
location = /sw.js {
    include /etc/nginx/snippets/hear-a-note-security.conf;
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/" always;
}

location = /manifest.webmanifest {
    include /etc/nginx/snippets/hear-a-note-security.conf;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
}

# assetlinks.json, needed when publishing to Google Play (TWA)
location /.well-known/ {
    default_type application/json;
}

# Sounds and icons: long-term caching (Nginx does not know .wav by default, so set the type)
location ~* \.wav$ {
    include /etc/nginx/snippets/hear-a-note-security.conf;
    default_type audio/wav;
    add_header Cache-Control "public, max-age=2592000" always;
}
location ~* \.(mp3|png|svg)$ {
    include /etc/nginx/snippets/hear-a-note-security.conf;
    add_header Cache-Control "public, max-age=2592000" always;
}

location / {
    limit_except GET HEAD { deny all; }
    try_files $uri $uri/ /index.html;
}
