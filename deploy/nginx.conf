# Nginx 設定：靜態檔由 Nginx 直接提供（最快），/api 轉給 Python (uvicorn)
# setup.sh 會把 __DOMAIN__ 和 __APP_DIR__ 換成真正的值
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __APP_DIR__/static;
    index index.html;

    # 安全標頭
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json;

    # Python 後端
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service Worker 不能被快取，否則使用者拿不到新版
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # 上架 Google Play（TWA）時需要的 assetlinks.json
    location /.well-known/ {
        default_type application/json;
    }

    # 音檔、圖示：長期快取（Nginx 預設不認得 .wav，補上類型）
    location ~* \.wav$ {
        default_type audio/wav;
        add_header Cache-Control "public, max-age=2592000" always;
    }
    location ~* \.(mp3|png|svg)$ {
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
