<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Toddler Music Box</title>
  <meta name="description" content="A colorful piano that teaches toddlers to read treble and bass clef. Works offline, no ads, no data collected.">
  <meta name="theme-color" content="#FFF5F8">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- #app: on portrait phones the whole screen is rotated 90° into landscape -->
<div id="app" data-clef="G">
  <!-- Top row: big "current note" card on the left (for the child), menus on the right (for parents) -->
  <div class="top">
    <!-- "Current note" layer: staff → key to press (for learning to read music) -->
    <section id="now" class="now empty" aria-live="polite">
      <div class="now-card">
        <span class="now-bubble" aria-hidden="true">♪&#xFE0E;</span>
        <img id="nowStaff" class="now-staff" alt="">
        <span class="now-arrow" aria-hidden="true"></span>
        <div class="now-key-wrap">
          <div id="nowKey" class="mini-key"></div>
        </div>
      </div>
    </section>
    <header class="bar">
      <!-- While a song or quiz is being played, the menus fold into this small button (double-tap to open) -->
      <button id="menuBtn" class="menu-btn" type="button"><span aria-hidden="true"></span></button>
      <!-- Row 1: clef, play on my piano, language -->
      <div class="bar-row">
        <span class="clef-pick">
          <img id="clefIcon" class="clef-icon" alt="" draggable="false">
          <select id="clef" class="select clef-select">
            <option value="G"></option>
            <option value="F"></option>
          </select>
        </span>
        <select id="mode" class="select mode-select">
          <option value="screen"></option>
          <option value="piano"></option>
        </select>
        <select id="lang" class="select lang"></select>
      </div>
      <!-- Row 2: everything else -->
      <div class="bar-row">
        <select id="song" class="select song-select"></select>
        <button id="playBtn" class="chip play-btn" disabled></button>
        <button id="quizBtn" class="chip quiz-btn"></button>
        <span id="pianoStatus" class="piano-status" aria-live="polite"></span>
        <span id="status" class="status" aria-live="polite"></span>
      </div>
    </header>
  </div>

  <main id="keys" class="keys" aria-label="Piano keys"></main>

  <!-- Praise shown when the quiz is all correct -->
  <img id="praise" class="praise" src="icons/praise.png" alt="" hidden aria-hidden="true" draggable="false">

  <!-- Microphone permission dialog (for parents) -->
  <div id="micDialog" class="dialog-backdrop" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="micTitle">
      <div class="dialog-icon" aria-hidden="true">
        <!-- microphone drawn in the clef color (no colored emoji) -->
        <svg viewBox="0 0 48 48" width="44" height="44"><rect x="17" y="5" width="14" height="24" rx="7" fill="var(--t-250)" stroke="var(--t-600)" stroke-width="3"/><path d="M11 22a13 13 0 0 0 26 0M24 35v7M17 42h14" fill="none" stroke="var(--t-600)" stroke-width="3" stroke-linecap="round"/></svg>
      </div>
      <h2 id="micTitle"></h2>
      <p id="micBody"></p>
      <div class="dialog-actions">
        <button id="micClose" class="chip"></button>
        <button id="micOk" class="chip primary"></button>
      </div>
    </div>
  </div>
</div>

  <script src="piano.js"></script>
  <script src="app.js"></script>
</body>
</html>
